<!DOCTYPE html>
<html lang="uz">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Ball Runner</title>

<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    touch-action: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #111;
    font-family: Arial, sans-serif;
}


/* =========================
   GAME
========================= */

#game {

    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            #222 0%,
            #333 14%,
            #111 14%,
            #111 86%,
            #333 86%,
            #222 100%
        );
}


/* =========================
   ROAD
========================= */

#road {

    position: absolute;

    left: 14%;
    top: 0;

    width: 72%;
    height: 100%;

    overflow: hidden;

    background:
        repeating-linear-gradient(
            to bottom,
            #292929 0px,
            #292929 80px,
            #333 80px,
            #333 160px
        );

    border-left: 5px solid white;
    border-right: 5px solid white;
}


/* =========================
   ROAD LINES
========================= */

.road-line {

    position: absolute;

    width: 6px;
    height: 70px;

    background: white;

    opacity: 0.75;

    animation:
        roadAnimation 0.7s
        linear infinite;
}

.road-line.one {
    left: 33%;
}

.road-line.two {
    left: 66%;
}

@keyframes roadAnimation {

    from {
        transform: translateY(-120px);
    }

    to {
        transform: translateY(100vh);
    }
}


/* =========================
   SCORE
========================= */

#scoreBox {

    position: absolute;

    top: 20px;
    left: 20px;

    z-index: 50;

    padding: 10px 16px;

    color: white;

    font-size: 22px;
    font-weight: bold;

    background: rgba(0,0,0,0.65);

    border-radius: 12px;
}


/* =========================
   LEVEL
========================= */

#levelBox {

    position: absolute;

    top: 20px;
    right: 20px;

    z-index: 50;

    padding: 10px 16px;

    color: white;

    font-size: 18px;
    font-weight: bold;

    background: rgba(0,0,0,0.65);

    border-radius: 12px;
}


/* =========================
   BALL
========================= */

#ball {

    position: absolute;

    width: 65px;
    height: 65px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            white 0%,
            #7df9ff 10%,
            #00b7ff 40%,
            #0066ff 75%,
            #001d70 100%
        );

    box-shadow:
        0 0 15px #00bfff,
        0 0 30px rgba(0,191,255,0.6);

    z-index: 20;
}


/* =========================
   OBSTACLE
========================= */

.obstacle {

    position: absolute;

    width: 75px;
    height: 75px;

    background:
        linear-gradient(
            135deg,
            #ff3333,
            #990000
        );

    border: 4px solid #ffaaaa;

    border-radius: 12px;

    box-shadow:
        0 0 20px rgba(255,0,0,0.8);

    z-index: 15;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 38px;
    font-weight: bold;
}


/* =========================
   CONTROL BUTTONS
========================= */

.controls {

    position: absolute;

    left: 0;
    bottom: 25px;

    width: 100%;

    padding: 0 25px;

    display: flex;

    justify-content: space-between;

    z-index: 60;
}


.control {

    width: 120px;
    height: 120px;

    border-radius: 50%;

    border: 4px solid rgba(255,255,255,0.8);

    background:
        radial-gradient(
            circle,
            #555,
            #222
        );

    color: white;

    font-size: 55px;

    display: flex;

    align-items: center;
    justify-content: center;

    user-select: none;
    -webkit-user-select: none;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.6);
}


.control:active {

    transform: scale(0.92);
}


/* =========================
   GAME OVER
========================= */

#gameOver {

    display: none;

    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 85%;
    max-width: 400px;

    padding: 35px;

    z-index: 100;

    background: rgba(0,0,0,0.95);

    color: white;

    text-align: center;

    border-radius: 25px;
}


#gameOver h1 {

    margin-bottom: 15px;

    font-size: 40px;
}


#finalScore {

    margin-bottom: 25px;

    font-size: 25px;
}


#restart {

    padding: 15px 35px;

    border: none;
    border-radius: 15px;

    background: #00aaff;

    color: white;

    font-size: 20px;
    font-weight: bold;
}

</style>

</head>


<body>


<div id="game">


    <!-- ROAD -->

    <div id="road">

        <div class="road-line one"></div>

        <div class="road-line two"></div>

    </div>


    <!-- SCORE -->

    <div id="scoreBox">

        SCORE:
        <span id="score">0</span>

    </div>


    <!-- LEVEL -->

    <div id="levelBox">

        LEVEL:
        <span id="level">1</span>

    </div>


    <!-- BALL -->

    <div id="ball"></div>


    <!-- CONTROLS -->

    <div class="controls">

        <div
            class="control"
            id="leftButton">

            ◀

        </div>


        <div
            class="control"
            id="rightButton">

            ▶

        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <h1>
            GAME OVER
        </h1>

        <div id="finalScore">
            Score: 0
        </div>

        <button id="restart">
            PLAY AGAIN
        </button>

    </div>


</div>


<script>

/* =====================================================
   ELEMENTLAR
===================================================== */

const game =
    document.getElementById("game");

const road =
    document.getElementById("road");

const ball =
    document.getElementById("ball");

const scoreElement =
    document.getElementById("score");

const levelElement =
    document.getElementById("level");

const leftButton =
    document.getElementById("leftButton");

const rightButton =
    document.getElementById("rightButton");

const gameOverScreen =
    document.getElementById("gameOver");

const finalScoreElement =
    document.getElementById("finalScore");

const restartButton =
    document.getElementById("restart");


/* =====================================================
   O'YIN O'ZGARUVCHILARI
===================================================== */

let gameRunning = false;

let score = 0;

let level = 1;

let speed = 4;

let ballPosition = 50;

let obstacles = [];

let obstacleTimer = null;

let leftPressed = false;

let rightPressed = false;


/* =====================================================
   BALL JOYLASHUVI
===================================================== */

function updateBall() {

    const roadWidth =
        road.clientWidth;

    const ballWidth =
        ball.clientWidth;

    const availableWidth =
        roadWidth - ballWidth;

    let x =
        availableWidth *
        (ballPosition / 100);


    if (x < 0) {
        x = 0;
    }


    if (x > availableWidth) {
        x = availableWidth;
    }


    ball.style.left =
        (road.offsetLeft + x) + "px";


    ball.style.top =
        (window.innerHeight - 220) + "px";
}


/* =====================================================
   CHAPGA
===================================================== */

function moveLeft() {

    if (!gameRunning) {
        return;
    }


    ballPosition -= 1.5;


    if (ballPosition < 0) {
        ballPosition = 0;
    }


    updateBall();
}


/* =====================================================
   O'NGGA
===================================================== */

function moveRight() {

    if (!gameRunning) {
        return;
    }


    ballPosition += 1.5;


    if (ballPosition > 100) {
        ballPosition = 100;
    }


    updateBall();
}


/* =====================================================
   TOUCH CONTROL
===================================================== */

leftButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        leftPressed = true;

    },
    { passive: false }
);


leftButton.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        leftPressed = false;

    },
    { passive: false }
);


leftButton.addEventListener(
    "touchcancel",
    function() {

        leftPressed = false;

    }
);


rightButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        rightPressed = true;

    },
    { passive: false }
);


rightButton.addEventListener(
    "touchend",
    function(event) {

        event.preventDefault();

        rightPressed = false;

    },
    { passive: false }
);


rightButton.addEventListener(
    "touchcancel",
    function() {

        rightPressed = false;

    }
);


/* =====================================================
   MOUSE CONTROL
===================================================== */

leftButton.addEventListener(
    "mousedown",
    function() {

        leftPressed = true;

    }
);


leftButton.addEventListener(
    "mouseup",
    function() {

        leftPressed = false;

    }
);


leftButton.addEventListener(
    "mouseleave",
    function() {

        leftPressed = false;

    }
);


rightButton.addEventListener(
    "mousedown",
    function() {

        rightPressed = true;

    }
);


rightButton.addEventListener(
    "mouseup",
    function() {

        rightPressed = false;

    }
);


rightButton.addEventListener(
    "mouseleave",
    function() {

        rightPressed = false;

    }
);


/* =====================================================
   UZLUKSIZ BOSHQARUV
===================================================== */

function controlLoop() {

    if (leftPressed) {
        moveLeft();
    }


    if (rightPressed) {
        moveRight();
    }


    requestAnimationFrame(
        controlLoop
    );
}


controlLoop();


/* =====================================================
   TO'SIQ YARATISH
===================================================== */

function createObstacle() {

    if (!gameRunning) {
        return;
    }


    const obstacle =
        document.createElement("div");


    obstacle.className =
        "obstacle";


    obstacle.textContent =
        "⚠";


    /*
       TO'SIQNI YO'L ICHIGA
       JOYLASHTIRAMIZ
    */

    const roadWidth =
        road.clientWidth;

    const obstacleWidth =
        75;


    const maximumX =
        roadWidth -
        obstacleWidth;


    const randomX =
        Math.random() *
        maximumX;


    /*
       ABSOLUTE PIXEL
       KOORDINATA
    */

    const obstacleX =
        road.offsetLeft +
        randomX;


    obstacle.style.left =
        obstacleX + "px";


    obstacle.style.top =
        "-90px";


    game.appendChild(
        obstacle
    );


    obstacles.push({

        element: obstacle,

        y: -90

    });
}


/* =====================================================
   TO'QNASHUVNI TEKSHIRISH
===================================================== */

function isCollision(
    object1,
    object2
) {

    const rect1 =
        object1.getBoundingClientRect();

    const rect2 =
        object2.getBoundingClientRect();


    return !(
        rect1.right < rect2.left ||
        rect1.left > rect2.right ||
        rect1.bottom < rect2.top ||
        rect1.top > rect2.bottom
    );
}


/* =====================================================
   TO'SIQLARNI HARAKATLANTIRISH
===================================================== */

function updateObstacles() {

    if (!gameRunning) {
        return;
    }


    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];


        /*
           PASTGA HARAKAT
        */

        obstacle.y += speed;


        obstacle.element.style.top =
            obstacle.y + "px";


        /*
           TO'QNASHUV
        */

        if (
            isCollision(
                ball,
                obstacle.element
            )
        ) {

            endGame();

            return;
        }


        /*
           EKRANDAN CHIQIB KETDI
        */

        if (
            obstacle.y >
            window.innerHeight + 100
        ) {

            obstacle.element.remove();


            obstacles.splice(
                i,
                1
            );


            score++;


            scoreElement.textContent =
                score;


            /*
               HAR 10 OCHKODA
               LEVEL OSHADI
            */

            if (
                score % 10 === 0
            ) {

                level++;

                levelElement.textContent =
                    level;

                speed += 0.6;
            }
        }
    }
}


/* =====================================================
   ASOSIY GAME LOOP
===================================================== */

function gameLoop() {

    updateObstacles();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   TO'SIQLAR TIMERI
===================================================== */

function startObstacleTimer() {

    /*
       OLD TIMERNI O'CHIRAMIZ
    */

    if (
        obstacleTimer !== null
    ) {

        clearInterval(
            obstacleTimer
        );

        obstacleTimer = null;
    }


    /*
       YANGI TIMER
    */

    obstacleTimer =
        setInterval(
            function() {

                createObstacle();

            },
            1000
        );
}


/* =====================================================
   BARCHA TO'SIQLARNI O'CHIRISH
===================================================== */

function removeAllObstacles() {

    obstacles.forEach(
        function(obstacle) {

            if (
                obstacle.element
            ) {

                obstacle.element.remove();

            }

        }
    );


    obstacles = [];
}


/* =====================================================
   GAME OVER
===================================================== */

function endGame() {

    gameRunning = false;


    leftPressed = false;

    rightPressed = false;


    /*
       TIMERNI TO'XTATISH
    */

    if (
        obstacleTimer !== null
    ) {

        clearInterval(
            obstacleTimer
        );

        obstacleTimer = null;
    }


    finalScoreElement.textContent =
        "Score: " + score;


    gameOverScreen.style.display =
        "block";
}


/* =====================================================
   YANGI O'YIN
===================================================== */

function startGame() {

    /*
       TIMERNI TO'XTATISH
    */

    if (
        obstacleTimer !== null
    ) {

        clearInterval(
            obstacleTimer
        );

        obstacleTimer = null;
    }


    /*
       ESKI TO'SIQLARNI
       TO'LIQ O'CHIRISH
    */

    removeAllObstacles();


    /*
       O'YINNI RESET
    */

    score = 0;

    level = 1;

    speed = 4;

    ballPosition = 50;


    scoreElement.textContent =
        "0";


    levelElement.textContent =
        "1";


    /*
       GAME OVERNI YOPISH
    */

    gameOverScreen.style.display =
        "none";


    /*
       O'YINNI YOQISH
    */

    gameRunning = true;


    /*
       BALLNI MARKAZGA QAYTARISH
    */

    updateBall();


    /*
       TO'SIQLARNI QAYTA BOSHLASH
    */

    startObstacleTimer();
}


/* =====================================================
   PLAY AGAIN
===================================================== */

restartButton.addEventListener(
    "click",
    function() {

        startGame();

    }
);


/* =====================================================
   EKRAN O'ZGARSA BALLNI
   QAYTA JOYLASHTIRISH
===================================================== */

window.addEventListener(
    "resize",
    function() {

        updateBall();

    }
);


/* =====================================================
   START
===================================================== */

updateBall();

startGame();

gameLoop();

</script>

</body>
</html>
