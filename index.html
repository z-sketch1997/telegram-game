<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ball Game</title>

<style>
* {
    box-sizing: border-box;
    touch-action: manipulation;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: linear-gradient(#78cbea, #dff6ff);
}

/* Yo‘l */
#road {
    position: absolute;
    width: 72%;
    height: 100%;
    left: 14%;
    background: #d2ad72;
    border-left: 7px solid #9b7746;
    border-right: 7px solid #9b7746;
}

/* Yuqoridagi ma'lumot */
#info {
    position: absolute;
    top: 15px;
    width: 100%;
    text-align: center;
    z-index: 10;
    color: white;
    font-size: 25px;
    font-weight: bold;
    text-shadow: 2px 2px 4px #333;
}

#ball {
    position: absolute;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, white, #00c8d8 18%, #008899 55%, #004d55);
    box-shadow: 0 8px 12px rgba(0,0,0,.4);
    z-index: 5;
}

/* To'siq */
.obstacle {
    position: absolute;
    width: 90px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(#e84b3c, #9d1710);
    border: 4px solid white;
    box-shadow: 0 5px 8px rgba(0,0,0,.4);
    z-index: 4;
}

.obstacle::after {
    content: "⚠";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: yellow;
    font-size: 22px;
}

/* Tugmalar */
.control {
    position: absolute;
    bottom: 40px;
    width: 125px;
    height: 125px;
    border-radius: 50%;
    border: 5px solid white;
    background: rgba(40,70,85,.75);
    color: white;
    font-size: 55px;
    z-index: 20;
}

#left {
    left: 8%;
}

#right {
    right: 8%;
}

.control:active {
    transform: scale(.92);
    background: rgba(20,40,50,.95);
}

#gameover {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.75);
    color: white;
    z-index: 50;
    text-align: center;
    padding-top: 35vh;
}

#gameover h1 {
    font-size: 42px;
}

#restart {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="info">
        LEVEL: <span id="level">1</span>
        &nbsp;&nbsp;
        BALL: <span id="score">0</span>
    </div>

    <div id="ball"></div>

    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>

    <div id="gameover">
        <h1>GAME OVER</h1>
        <p>Ball: <span id="finalScore">0</span></p>
        <button id="restart">QAYTA O‘YNASH</button>
    </div>

</div>

<script>

const game = document.getElementById("game");
const ball = document.getElementById("ball");
const scoreText = document.getElementById("score");
const levelText = document.getElementById("level");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");

let ballX = 50;
let score = 0;
let level = 1;
let speed = 3;
let gameRunning = true;

let obstacles = [];

/* Sharni joylashtirish */
function updateBall() {

    const road = document.getElementById("road");
    const roadLeft = road.offsetLeft;
    const roadWidth = road.offsetWidth;

    const x = roadLeft + (roadWidth - ball.offsetWidth) * ballX / 100;

    ball.style.left = x + "px";
    ball.style.bottom = "190px";
}

/* To'siq yaratish */
function createObstacle() {

    const obstacle = document.createElement("div");

    obstacle.className = "obstacle";

    const road = document.getElementById("road");

    const minX = road.offsetLeft + 10;
    const maxX = road.offsetLeft + road.offsetWidth - 100;

    const x = minX + Math.random() * (maxX - minX);

    obstacle.style.left = x + "px";
    obstacle.style.top = "-50px";

    game.appendChild(obstacle);

    obstacles.push({
        element: obstacle,
        x: x,
        y: -50,
        passed: false
    });
}

/* To'siqlarni harakatlantirish */
function moveObstacles() {

    for (let i = obstacles.length - 1; i >= 0; i--) {

        let o = obstacles[i];

        o.y += speed;
        o.element.style.top = o.y + "px";

        /* To'siq o'tib ketganda */
        if (!o.passed && o.y > window.innerHeight - 250) {

            o.passed = true;
            score++;

            scoreText.textContent = score;

            if (score % 10 === 0) {
                level++;
                speed += 0.7;
                levelText.textContent = level;
            }
        }

        /* Ekrandan chiqsa */
        if (o.y > window.innerHeight + 100) {

            o.element.remove();
            obstacles.splice(i, 1);
        }

        /* To'qnashuv */
        checkCollision(o);
    }
}

/* To'qnashuvni tekshirish */
function checkCollision(o) {

    const b = ball.getBoundingClientRect();
    const r = o.element.getBoundingClientRect();

    if (
        b.left < r.right &&
        b.right > r.left &&
        b.top < r.bottom &&
        b.bottom > r.top
    ) {
        endGame();
    }
}

/* O'yinni tugatish */
function endGame() {

    if (!gameRunning) return;

    gameRunning = false;

    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameover").style.display = "block";
}

/* Qayta boshlash */
document.getElementById("restart").onclick = function() {

    location.reload();

};

/* Chap */
function moveLeft() {

    if (!gameRunning) return;

    ballX -= 7;

    if (ballX < 0)
        ballX = 0;

    updateBall();
}

/* O'ng */
function moveRight() {

    if (!gameRunning) return;

    ballX += 7;

    if (ballX > 100)
        ballX = 100;

    updateBall();
}

/* Telefon tugmalari */
leftButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveLeft();
});

rightButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    moveRight();
});

/* Sichqoncha uchun */
leftButton.onclick = moveLeft;
rightButton.onclick = moveRight;

/* Klaviatura */
document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft")
        moveLeft();

    if (e.key === "ArrowRight")
        moveRight();

});

/* Harakat */
function gameLoop() {

    if (gameRunning) {
        moveObstacles();
    }

    requestAnimationFrame(gameLoop);
}

/* Har 1 sekundda yangi to'siq */
setInterval(function() {

    if (gameRunning) {
        createObstacle();
    }

}, 1000);

/* Boshlash */
window.addEventListener("resize", updateBall);

updateBall();
gameLoop();

</script>

</body>
</html>
